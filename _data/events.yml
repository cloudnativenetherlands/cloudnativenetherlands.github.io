# Events shown on /events.
#
# To announce an event, add it under `upcoming` (remove the [] first):
#
# upcoming:
#   - date: 12 Mar 2027
#     title: Cloud Native Meetup, Amsterdam
#     text: One or two sentences about the event.
#     link: https://example.org/tickets
#     link_label: Tickets and agenda
#
# Photos are optional. Add them to an event like this (shape is wide or tall):
#     photos:
#       - src: /assets/img/photo.jpg
#         alt: Short description of the photo
#         shape: wide
#
# After the event, move the entry to the top of `past`.
upcoming: []

